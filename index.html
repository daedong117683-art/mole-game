<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7cc95a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>두더지 잡기 놀이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: one-screen garden — sky header with player + score signs, 3x3 dirt holes on grass; player picker and results as wooden-sign cards */
:root{
  --sky:#bfe6ff; --sky2:#bfe6ff; --grass:#7cc95a; --grass-dark:#4f9a35; --dirt:#6b3f22; --dirt-dark:#3d2312;
  --mole:#a8703f; --nose:#ff7aa2; --sign:#fff6d6; --sign-2:#ffe9a8; --ink:#3a2a1a; --gold:#ffc83d;
  --red:#ff6b4a; --red-dark:#c1432a; --blue:#4aa8ff; --blue-dark:#2a74c1;
  --pink:#ff2fa6; --pink-glow:rgba(255,47,166,.85); --ice:#bfefff; --coin:#f5b400; --angry:#d9543a; --skull-glow:#b04bff;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:linear-gradient(var(--sky2) 0%, var(--sky) 22%, var(--grass) 22%, var(--grass) 100%);transition:background .4s;color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.layout{position:relative;z-index:1;height:100%;max-width:880px;margin:0 auto;display:flex;gap:24px;justify-content:center}
.wrap{flex:1;min-width:0;max-width:520px;height:100%;display:flex;flex-direction:column;gap:12px}
.board{display:none;flex:0 0 280px;align-self:center;max-height:calc(100% - 20px);flex-direction:column;background:var(--sign);border:5px solid var(--dirt);border-radius:22px;padding:14px 14px 12px;box-shadow:0 6px 0 var(--dirt-dark);box-sizing:border-box;position:relative}
.board::before,.board::after{content:"";position:absolute;top:-22px;width:12px;height:22px;background:var(--dirt);border-radius:4px 4px 0 0}
.board::before{left:40px}.board::after{right:40px}
.board h3{margin:0 0 4px;font-weight:400;font-size:26px;text-align:center}
.board .sub{margin:0 0 10px;text-align:center;font-size:15px;color:var(--dirt)}
.board ol{list-style:none;padding:0;margin:0;display:grid;gap:8px;overflow:auto;min-height:0}
.board li{display:grid;grid-template-columns:30px 36px 1fr auto;align-items:center;gap:6px;background:#fff;border:3px solid var(--sign-2);border-radius:14px;padding:6px 10px;font-size:19px}
.board li.me{border-color:var(--red);background:var(--sign-2)}
.board li.top1{box-shadow:0 0 0 3px var(--gold)}
.board .medal{font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.board .av{font-size:28px;text-align:center}
.board .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;flex-direction:column;line-height:1.15}
.board .nm small{font-size:13px;color:var(--dirt)}
.board .pt{font-variant-numeric:tabular-nums;font-size:22px;color:var(--red)}
.board .pt small{font-size:14px;color:var(--ink)}
.board .empty{text-align:center;font-size:17px;line-height:1.6;padding:18px 4px;color:var(--dirt)}
@media (min-width:820px){.board{display:flex}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-weight:400;font-size:clamp(24px,7vw,36px);color:#fff;text-shadow:0 3px 0 var(--grass-dark),0 0 12px rgba(0,0,0,.15)}
.who{font-family:var(--font);font-size:18px;background:var(--sign);color:var(--ink);border:3px solid var(--dirt);border-radius:999px;
  padding:4px 12px 4px 6px;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 3px 0 var(--dirt-dark);max-width:55%}
.who .av{font-size:24px}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who:focus-visible{outline:4px solid #fff}
.signs{display:flex;gap:10px;justify-content:center}
.sign{position:relative;background:var(--sign);border:4px solid var(--dirt);border-radius:14px;padding:6px 10px;text-align:center;flex:1;min-width:0;max-width:120px;box-shadow:0 4px 0 var(--dirt-dark)}
.sign.coin b{color:var(--dirt)}
.coinpop{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:20px;color:var(--coin);text-shadow:0 2px 0 var(--dirt-dark);white-space:nowrap;pointer-events:none;animation:pop .9s ease-out forwards}
@media (max-width:480px){.signs{gap:6px}.sign{padding:4px 4px;border-width:3px}.sign small{font-size:13px}.sign b{font-size:24px}}
.sign small{display:block;font-size:15px;color:var(--dirt)}
.sign b{font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.field{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.grid{width:min(100%,58vh);aspect-ratio:1/1;width:min(100cqw,100cqh);height:min(100cqw,100cqh);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:clamp(8px,3cqmin,20px)}
.hole{position:relative;width:100%;height:100%;min-width:0;min-height:0;border:0;padding:0;background:none;cursor:pointer;overflow:hidden;border-radius:0 0 50% 50%}
.hole:focus-visible{outline:4px solid #fff;outline-offset:2px}
.hole::after{content:"";position:absolute;left:4%;right:4%;bottom:6%;height:30%;background:radial-gradient(ellipse at 50% 40%,var(--dirt-dark) 55%,var(--dirt) 56%);border-radius:50%;z-index:3}
.critter{position:absolute;left:50%;bottom:-70%;width:68%;height:72%;transform:translateX(-50%);transition:bottom .15s ease-out;z-index:2;font-size:clamp(40px,13vw,72px);display:grid;place-items:center}
.hole.up .critter{bottom:16%}
.mole{background:var(--mole);border-radius:50% 50% 30% 30%;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.mole svg{width:100%;height:100%;display:block;pointer-events:none}
.critter.gold{background:var(--gold);box-shadow:0 0 18px var(--gold),inset 0 -8px 0 rgba(0,0,0,.1)}
.critter.tiny{width:26%;height:46%;bottom:-62%;border-radius:50% 50% 34% 34%/34% 34% 20% 20%;background:var(--pink);box-shadow:0 0 14px 5px var(--pink-glow),inset 0 -5px 0 rgba(0,0,0,.12)}
.hole.up .critter.tiny{bottom:18%}
.critter.tiny::before{content:"⭐";position:absolute;top:-24%;left:50%;transform:translateX(-50%);font-size:clamp(14px,4vw,24px);line-height:1}
.critter.bee,.critter.skull{background:none;box-shadow:none}
.critter.skull{filter:drop-shadow(0 0 10px var(--skull-glow))}
.hole.danger::before{content:"";position:absolute;inset:18% 6% 6%;border-radius:50%;background:radial-gradient(var(--skull-glow),transparent 70%);z-index:1;animation:throb .45s ease-in-out infinite alternate}
@keyframes throb{from{opacity:.35}to{opacity:1}}
.critter.angry{background:var(--angry);box-shadow:0 0 14px var(--angry),inset 0 -8px 0 rgba(0,0,0,.15);animation:shake .09s linear 5}
@keyframes shake{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-57%) rotate(-7deg)}75%{transform:translateX(-43%) rotate(7deg)}}
.vein{position:absolute;top:-8%;right:-14%;font-size:clamp(18px,6vw,34px);line-height:1;animation:vein .25s ease-out}
.tiny .vein{font-size:clamp(12px,3.5vw,18px)}
@keyframes vein{from{transform:scale(0)}to{transform:scale(1)}}
.field.quake{animation:quake .07s linear 6}
@keyframes quake{0%,100%{transform:translate(0,0)}25%{transform:translate(-7px,3px)}75%{transform:translate(7px,-3px)}}
.sign.zero{animation:flash .3s linear 3}
@keyframes flash{50%{background:var(--skull-glow);color:#fff}}
.pop{position:absolute;left:50%;top:10%;transform:translateX(-50%);font-size:clamp(20px,5.5vw,30px);color:#fff;z-index:5;white-space:nowrap;text-shadow:0 2px 0 var(--ink);pointer-events:none;animation:pop .7s ease-out forwards}
.pop.boom{font-size:clamp(26px,7vw,40px);text-shadow:0 2px 0 #2b0d3d,0 0 12px var(--skull-glow)}
.pop.miss{font-size:clamp(16px,4.5vw,22px);color:var(--sign)}
@keyframes pop{to{top:-20%;opacity:0}}
/* 세계 장식 · 떨어지는 효과 */
.fx,.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.deco span{position:absolute;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.deco .star{width:3px;height:3px;border-radius:50%;background:#fff;filter:none;animation:twinkle 1.6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
.pt{position:absolute;top:-40px;line-height:1;animation:fall linear forwards}
.pt.up{top:auto;bottom:-30px;animation-name:rise}
.pt.sprinkle{width:5px;height:14px;border-radius:3px}
@keyframes fall{to{transform:translateY(112vh) rotate(260deg)}}
@keyframes rise{to{transform:translateY(-112vh);opacity:0}}
/* 세계별 두더지 */
.w-candy .critter.gold{background:#ff8fc8;box-shadow:0 0 16px #ff8fc8,inset 0 -8px 0 rgba(0,0,0,.1)}
.w-candy .critter.gold::before{content:"🍩";position:absolute;top:-30%;left:50%;transform:translateX(-50%);font-size:clamp(18px,5vw,30px);line-height:1}
.w-ice .critter{transition-duration:.08s}
.w-ice .critter.mole::after{content:"";position:absolute;left:2%;right:2%;bottom:16%;height:11%;background:#e63946;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.w-lava .critter.mole:not(.angry)::after{content:"";position:absolute;top:21%;left:22%;width:56%;height:6%;border-radius:4px;background:linear-gradient(to right,#ff3b1f 0 36%,transparent 36% 64%,#ff3b1f 64%)}
.w-lava .critter.mole{box-shadow:0 0 12px rgba(255,90,31,.6),inset 0 -8px 0 rgba(0,0,0,.2)}
.w-lava .hole::after{animation:lava 1.2s ease-in-out infinite alternate}
@keyframes lava{to{filter:brightness(1.35)}}
.w-space .critter.mole::after{content:"";position:absolute;inset:-9% -9% 12%;border:3px solid rgba(210,235,255,.9);border-radius:50%;background:rgba(180,220,255,.16);box-shadow:inset 6px 6px 0 rgba(255,255,255,.25)}
.critter.fire{background:none;box-shadow:none;filter:drop-shadow(0 0 10px #ff7a1a)}
/* 홈 (세계 지도) */
.card.home{max-width:460px}
.homebar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:18px;margin-bottom:10px}
.worlds{display:grid;gap:10px}
.wd{position:relative;display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;width:100%;border:4px solid var(--dirt);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--dirt-dark);font-family:var(--font);color:var(--ink);text-align:left;cursor:pointer;min-width:0}
.wd .wic{font-size:44px;line-height:1;text-align:center;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.wd .wtx{min-width:0;display:flex;flex-direction:column;gap:2px}
.wd .wnm{font-size:22px;background:rgba(255,255,255,.88);border-radius:10px;padding:0 8px;justify-self:start;width:max-content;max-width:100%}
.wd .wst{font-size:15px;background:rgba(255,255,255,.75);border-radius:8px;padding:0 8px;width:max-content;max-width:100%}
.wd .wgo{font-size:18px;background:var(--red);color:#fff;border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 var(--red-dark);white-space:nowrap}
.wd.lock .wic{filter:grayscale(1) opacity(.6)}
.wd.lock .wgo{background:var(--blue);box-shadow:0 3px 0 var(--blue-dark)}
.wd.lock.poor .wgo{background:#cfc4a8;box-shadow:0 3px 0 #a99f86;font-size:15px}
.wd.lock.ask .wgo{background:var(--red);box-shadow:0 3px 0 var(--red-dark)}
.wd.cur{border-color:var(--red)}
.wd:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.wd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dirt-dark)}
.stars{color:var(--coin);letter-spacing:1px}
.stars i{font-style:normal;opacity:.3;filter:grayscale(1)}
.itembar{position:relative;z-index:4;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:52px;align-items:center}
.itm{font-family:var(--font);font-size:17px;color:var(--ink);background:var(--sign);border:3px solid var(--dirt);border-radius:14px;padding:4px 10px;min-height:48px;box-shadow:0 3px 0 var(--dirt-dark);display:flex;align-items:center;gap:5px;cursor:pointer}
.itm .ic{font-size:26px;line-height:1}
.itm .ct{font-size:15px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.itm:disabled{opacity:.4;cursor:default}
.itm.on,.itm.on:disabled{opacity:1;background:var(--ice);border-color:var(--blue);animation:throb .4s ease-in-out infinite alternate}
.itm.badge{cursor:default;box-shadow:none;border-style:dashed}
.itm:focus-visible{outline:4px solid #fff}
.itm:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--dirt-dark)}
.field{border-radius:22px;transition:background .3s}
.field.slowmo{background:rgba(74,168,255,.22)}
.field.slowmo .critter{transition-duration:.4s}
.field.icy{background:rgba(191,239,255,.45)}
.field.icy .critter.mole{box-shadow:inset 0 0 0 4px var(--ice),0 0 16px 4px var(--ice)}
.field.zap{animation:zap .45s ease-out}
@keyframes zap{0%{filter:brightness(1.9) saturate(1.6)}100%{filter:none}}

.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(40,80,20,.45);z-index:10;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--sign);border:5px solid var(--dirt);border-radius:24px;padding:20px 18px;text-align:center;width:100%;max-width:400px;max-height:100%;overflow:auto;box-sizing:border-box;box-shadow:0 6px 0 var(--dirt-dark)}
.card h2{margin:0 0 8px;font-weight:400;font-size:28px}
.card p{margin:6px 0;font-size:19px;line-height:1.5}
.legend{display:flex;justify-content:center;gap:14px;margin:10px 0;font-size:18px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:22px;height:22px;border-radius:50%;display:inline-block}
.btn{font-family:var(--font);font-size:26px;color:#fff;background:var(--red);border:0;border-radius:18px;padding:10px 30px;box-shadow:0 6px 0 var(--red-dark);cursor:pointer}
.btn.blue{background:var(--blue);box-shadow:0 6px 0 var(--blue-dark);font-size:20px;padding:8px 18px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-dark)}
.btn.blue:active{box-shadow:0 2px 0 var(--blue-dark)}
.btn:focus-visible,.pl:focus-visible,.ani:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.big{font-size:56px;margin:4px 0;color:var(--red)}
.earn{font-size:20px;margin:6px 0}
.wallet{font-size:32px;margin:2px 0 4px;color:var(--dirt)}
.wallet b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.it{background:#fff;border:4px solid var(--sign-2);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.it .ic{font-size:40px;line-height:1}
.it .nm{font-size:19px}
.it .ds{font-size:13px;color:var(--dirt);line-height:1.35;flex:1}
.it .own{font-size:14px}
.it.bought{animation:bought .45s ease-out;border-color:var(--coin)}
@keyframes bought{40%{transform:scale(1.07)}}
.buy{font-family:var(--font);font-size:17px;color:#fff;background:var(--blue);border:0;border-radius:12px;padding:7px 6px;box-shadow:0 4px 0 var(--blue-dark);cursor:pointer;width:100%}
.buy:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark)}
.buy:disabled{background:#cfc4a8;box-shadow:0 4px 0 #a99f86;cursor:default;font-size:15px}
.buy:focus-visible,.tog:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.pre{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.tog{font-family:var(--font);font-size:17px;color:var(--ink);background:#fff;border:3px solid var(--dirt);border-radius:999px;padding:6px 12px;cursor:pointer}
.tog.on{background:var(--sign-2);border-color:var(--red)}

.players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.pl-wrap{position:relative;min-width:0}
.pl{width:100%;font-family:var(--font);background:#fff;border:4px solid var(--dirt);border-radius:16px;padding:10px 6px 8px;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 var(--dirt-dark);display:flex;flex-direction:column;align-items:center;gap:2px}
.pl.on{background:var(--sign-2);border-color:var(--red)}
.pl .av{font-size:40px;line-height:1}
.pl .nm{font-size:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .bs{font-size:14px;color:var(--dirt)}
.del{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;border:3px solid var(--dirt);background:var(--sign);font-family:var(--font);font-size:16px;color:var(--dirt);cursor:pointer;line-height:1}
.del.ask{width:auto;padding:0 8px;border-radius:999px;background:var(--red);color:#fff;border-color:var(--red-dark);font-size:14px}
.add{border-style:dashed;background:transparent;box-shadow:none;justify-content:center;min-height:96px}
.add .av{font-size:32px}

.form label{display:block;font-size:18px;margin:8px 0 6px}
.form input{font-family:var(--font);font-size:24px;width:100%;box-sizing:border-box;padding:8px 12px;border:4px solid var(--dirt);border-radius:14px;text-align:center;background:#fff;color:var(--ink)}
.form input:focus{outline:none;border-color:var(--red)}
.animals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ani{font-size:34px;background:#fff;border:3px solid var(--dirt);border-radius:14px;padding:6px 0;cursor:pointer}
.ani.on{background:var(--sign-2);border-color:var(--red);transform:scale(1.06)}
.err{color:var(--red-dark);font-size:16px;min-height:20px;margin-top:6px}

.rank{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px;text-align:left}
.rank li{display:grid;grid-template-columns:34px 34px 1fr auto;align-items:center;gap:6px;background:#fff;border:3px solid var(--sign-2);border-radius:12px;padding:4px 10px;font-size:19px}
.rank li.me{border-color:var(--red);background:var(--sign-2)}
.rank .medal{font-size:22px;text-align:center}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rank .pt{font-variant-numeric:tabular-nums}
/* 레벨 · 캐릭터 · 알 */
.vsbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:15px}
.vsbar span{background:var(--sign);border:3px solid var(--dirt);border-radius:999px;padding:0 8px;white-space:nowrap;display:flex;gap:4px;align-items:center}
.vsbar span.me{border-color:var(--red);background:var(--sign-2)}
.vsbar b{font-weight:400;font-variant-numeric:tabular-nums;color:var(--red)}
.vsl{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px;text-align:left}
.vsl li{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--sign-2);border-radius:12px;padding:4px 10px;font-size:19px}
.vsl li.me{border-color:var(--red);background:var(--sign-2)}
.vsl .av{font-size:28px;line-height:1}.vsl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mav{position:relative;display:inline-block;width:1em;height:1em;border-radius:50%;background:#a8703f;vertical-align:middle;box-shadow:inset 0 -.08em 0 rgba(0,0,0,.15)}
.mav svg{width:100%;height:100%;display:block}
.mav.king{background:#ffc83d;box-shadow:0 0 .25em #ffc83d,inset 0 -.08em 0 rgba(0,0,0,.12)}
.mav.king::after{content:"👑";position:absolute;top:-.42em;left:50%;transform:translateX(-50%);font-size:.6em;line-height:1}
.lv,.lvchip{font-size:13px;background:var(--blue);color:#fff;border-radius:999px;padding:0 8px;flex:none;white-space:nowrap}

<script>
const $=id=>document.getElementById(id);
const field=$('field'),scoreEl=$('score'),timeEl=$('time'),bestEl=$('best'),coinsEl=$('coins'),bar=$('bar'),overlay=$('overlay'),card=$('card');

let score=0,time=30,playing=false,timers=[],ctx=null;

let gameXp=0,gameRate=5,catches=0,earned=0,usedItem=false,bigOn=false,slowUntil=0,iceUntil=0,selPre={big:false,time:false};
const ITEMS=[
  {id:'bolt',ic:'⚡',nm:'번개 망치',price:5,ds:'나와 있는 두더지를 한 번에 전부 잡아요'},
  {id:'slow',ic:'⏰',nm:'느림보 시계',price:4,ds:'5초 동안 두더지가 2배 오래 있어요'},
  {id:'ice',ic:'❄️',nm:'꽁꽁 얼음',price:4,ds:'3초 동안 두더지가 얼어서 못 들어가요'},
  {id:'big',ic:'🔨',nm:'왕 망치',price:3,ds:'이번 판 꼬마 두더지를 구멍 아무 데나 눌러도 잡아요'},
  {id:'shield',ic:'🛡️',nm:'해골 방패',price:3,ds:'해골을 눌러도 1번 막아줘요'},
  {id:'time',ic:'⏱️',nm:'시간 +5초',price:2,ds:'이번 판 시간이 35초가 돼요'}
];
const IT=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const isMole=k=>k==='mole'||k==='gold'||k==='tiny';
/* ---------- 레벨 · 알 · 캐릭터 ---------- */
const MAXLV=50,EGG_PRICE=10,PITY=30;
const need=n=>Math.floor(25+5*(n-1)+0.5*(n-1)*(n-1));
const CUM=[0,0];for(let n=1;n<MAXLV;n++)CUM[n+1]=CUM[n]+need(n);
const lvOf=xp=>{let l=1;while(l<MAXLV&&xp>=CUM[l+1])l++;return l};
const lvProg=xp=>{const l=lvOf(xp);if(l>=MAXLV)return{l,max:true,cur:0,need:0,pct:100};const cur=xp-CUM[l],nd=need(l);return{l,max:false,cur,need:nd,pct:Math.round(cur/nd*100)}};
const coinRate=l=>l>=40?2:l>=25?3:l>=10?4:5;
const TIERS=[
  {id:'common',nm:'보통',c:'#8f8f8f',p:55},{id:'good',nm:'좋음',c:'#2fa84f',p:28},{id:'rare',nm:'희귀',c:'#2f8fe6',p:12},
  {id:'hero',nm:'영웅',c:'#a63fe0',p:4},{id:'legend',nm:'전설',c:'#e5a400',p:1}];
const UP=[.6,.5,.4,.3];
const CH=[
  {id:'mole',nm:'두더지',ic:null,t:0},{id:'mouse',nm:'생쥐',ic:'🐭',t:0},{id:'chick',nm:'병아리',ic:'🐥',t:0},{id:'snail',nm:'달팽이',ic:'🐌',t:0},{id:'turtle',nm:'거북이',ic:'🐢',t:0},{id:'worm',nm:'애벌레',ic:'🐛',t:0},
  {id:'squirrel',nm:'다람쥐',ic:'🐿️',t:1},{id:'hedgehog',nm:'고슴도치',ic:'🦔',t:1},{id:'otter',nm:'수달',ic:'🦦',t:1},{id:'duck',nm:'오리',ic:'🦆',t:1},{id:'octopus',nm:'문어',ic:'🐙',t:1},{id:'crab',nm:'게',ic:'🦀',t:1},
  {id:'owl',nm:'부엉이',ic:'🦉',t:2},{id:'dolphin',nm:'돌고래',ic:'🐬',t:2},{id:'flamingo',nm:'플라밍고',ic:'🦩',t:2},{id:'parrot',nm:'앵무새',ic:'🦜',t:2},{id:'whale',nm:'고래',ic:'🐳',t:2},{id:'peacock',nm:'공작',ic:'🦚',t:2},
  {id:'unicorn',nm:'유니콘',ic:'🦄',t:3},{id:'trex',nm:'티라노',ic:'🦖',t:3},{id:'eagle',nm:'독수리',ic:'🦅',t:3},{id:'shark',nm:'상어',ic:'🦈',t:3},{id:'wolf',nm:'늑대',ic:'🐺',t:3},
  {id:'dragon',nm:'용',ic:'🐉',t:4},{id:'king',nm:'황금 두더지 왕',ic:null,t:4}];
const CHI=Object.fromEntries(CH.map(c=>[c.id,c]));
const initCtx=()=>{if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}};
const chAv=c=>c.ic||`<span class="mav${c.id==='king'?' king':''}">${face('happy')}</span>`;
const avOf=p=>p.eq&&CHI[p.eq]?chAv(CHI[p.eq]):p.emoji;
const addChar=(p,id)=>{p.chars[id]=(p.chars[id]||0)+1};
function addXp(p,n){const l0=lvOf(p.xp);p.xp=Math.min(CUM[MAXLV],p.xp+n);const l1=lvOf(p.xp);let c=0,e=0;for(let l=l0+1;l<=l1;l++){c+=3;if(l%5===0)e++}p.coins+=c;p.eggs+=e;return{l0,l1,c,e}}
function rollTier(p){
  if(p.pity>=PITY-1)return Math.random()<.8?3:4;
  let r=Math.random()*100;for(let i=0;i<TIERS.length;i++){r-=TIERS[i].p;if(r<0)return i}return 0}
function hatchOne(p){
  p.eggs--;const t=rollTier(p);p.pity=t>=3?0:p.pity+1;
  const c=rnd(CH.filter(x=>x.t===t)),isNew=!(p.chars[c.id]>0);addChar(p,c.id);return{c,t,isNew}}
const usable=(p,id)=>(p.chars[id]||0)-(p.eq===id?1:0);
function fuse(p,ids){
  if(ids.length!==3)return null;const t=CHI[ids[0]].t;
  if(t>=4||ids.some(id=>!CHI[id]||CHI[id].t!==t))return null;
  const need3={};ids.forEach(id=>need3[id]=(need3[id]||0)+1);
  if(Object.keys(need3).some(id=>usable(p,id)<need3[id]))return null;
  ids.forEach(id=>{p.chars[id]--;if(p.chars[id]<=0)delete p.chars[id]});
  const up=Math.random()<UP[t],nt=up?t+1:t;
  let pool=CH.filter(x=>x.t===nt);const alt=pool.filter(x=>!ids.includes(x.id));if(alt.length)pool=alt;
  const fresh=pool.filter(x=>!(p.chars[x.id]>0));
  const c=rnd(fresh.length?fresh:pool);addChar(p,c.id);return{c,t:nt,t0:t,up,isNew:fresh.length>0}}
const pityLine=p=>p.pity>=PITY-1?'다음 알은 영웅 이상 확정!':`영웅 이상 보장까지 알 ${PITY-p.pity}개`;

/* ---------- 세계 ---------- */
const SK3=[[3,9],[11,18],[20,26]];
const WORLDS={
  grass:{nm:'풀밭세계',ic:'🌱',price:0,sky2:'#bfe6ff',sky:'#bfe6ff',grass:'#7cc95a',gd:'#4f9a35',dirt:'#6b3f22',dd:'#3d2312',mole:'#a8703f',
    deco:[],fx:null,prob:{tiny:.06,gold:.11,bad:.14},stay:1,spawn:1,skulls:SK3,bad:{ic:'🐝',pen:2,cls:'bee'},twist:'기본 규칙이에요.'},
  candy:{nm:'과자세계',ic:'🍭',price:5,sky2:'#ffb8e0',sky:'#ffe0f1',grass:'#8b5a3c',gd:'#5e3a24',dirt:'#e0a868',dd:'#7a4a22',mole:'#d99a4e',
    deco:[['🍭',4,3,34],['🍪',88,6,30],['🧁',76,1,28],['🍬',14,12,24],['🍩',94,15,24]],fx:{type:'fall',items:'sprinkle',every:380},
    prob:{tiny:.06,gold:.24,bad:.14},stay:1,spawn:1,skulls:SK3,bad:{ic:'🐝',pen:2,cls:'bee'},twist:'🍩 도넛 두더지(3점)가 자주 나와요!'},
  ice:{nm:'얼음세계',ic:'❄️',price:10,sky2:'#a9def7',sky:'#e3f6ff',grass:'#f4fbff',gd:'#5aa9cf',dirt:'#a7dcf2',dd:'#2f7fa8',mole:'#f3f1ec',
    deco:[['⛄',5,4,34],['🏔️',86,2,38],['🌲',73,8,26],['❄️',18,12,20]],fx:{type:'fall',items:['❄️','❄','✻'],every:420},
    prob:{tiny:.06,gold:.11,bad:.14},stay:.8,spawn:1,skulls:SK3,bad:{ic:'🐝',pen:2,cls:'bee'},twist:'두더지가 미끄러지듯 빨리 들어가요!'},
  lava:{nm:'용암세계',ic:'🌋',price:15,sky2:'#3a0d0d',sky:'#ff7a3d',grass:'#2b2321',gd:'#120d0c',dirt:'#4a3a36',dd:'#ff5a1f',mole:'#3d3434',
    deco:[['🌋',6,3,40],['🌋',84,6,30],['🔥',20,13,20],['🔥',72,14,18]],fx:{type:'rise',items:['🔥','•','✦'],every:360},
    prob:{tiny:.06,gold:.11,bad:.16},stay:.95,spawn:.95,skulls:[[3,8],[10,15],[17,22],[23,27]],bad:{ic:'🔥',pen:3,cls:'fire'},twist:'🔥 불덩이는 -3점! 💀 해골이 4번 나와요!'},
  space:{nm:'우주세계',ic:'🚀',price:20,sky2:'#05061a',sky:'#1a1f4d',grass:'#a3a5b4',gd:'#5f6170',dirt:'#85879a',dd:'#23242f',mole:'#a8703f',
    deco:[['🪐',6,3,34],['🌙',86,4,32],['🛸',72,13,24],['⭐',22,13,16]],stars:true,fx:{type:'fall',items:['✨','☄️'],every:900},
    prob:{tiny:.12,gold:.11,bad:.14},stay:.85,spawn:.85,skulls:SK3,bad:{ic:'🐝',pen:2,cls:'bee'},twist:'⭐ 꼬마 두더지가 2배 자주! 대신 제일 빨라요!'}
};
const WORLD_IDS=Object.keys(WORLDS);
let curWorld='grass';
const W=()=>WORLDS[curWorld];
const starCount=b=>b>=30?3:b>=20?2:b>=10?1:0;
const starsHtml=n=>`<span class="stars" aria-label="별 ${n}개">${'⭐'.repeat(n)}${'<i>⭐</i>'.repeat(3-n)}</span>`;
const wBest=(p,w=curWorld)=>(p.bests&&p.bests[w])||0;
let fxTimer=null;
function applyWorld(id){
  curWorld=WORLDS[id]?id:'grass';const w=W(),r=document.documentElement.style;
  [['--sky2',w.sky2],['--sky',w.sky],['--grass',w.grass],['--grass-dark',w.gd],['--dirt',w.dirt],['--dirt-dark',w.dd],['--mole',w.mole]].forEach(([k,v])=>r.setProperty(k,v));
  WORLD_IDS.forEach(k=>document.body.classList.toggle('w-'+k,k===curWorld));
  const deco=$('deco');
  deco.innerHTML=w.deco.map(([e,x,y,sz])=>`<span style="left:${x}%;top:${y}%;font-size:${sz}px">${e}</span>`).join('')+
    (w.stars?Array.from({length:40},()=>`<span class="star" style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*1.6).toFixed(2)}s"></span>`).join(''):'');
  clearInterval(fxTimer);$('fx').innerHTML='';
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(w.fx&&!reduce)fxTimer=setInterval(()=>spawnFx(w.fx),w.fx.every);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=w.sky2;
  renderBoard();
}
const SPRINKLE=['#ff5c8a','#ffd23f','#5ec8ff','#7be07b','#b98cff','#fff'];
function spawnFx(f){
  const fx=$('fx');if(fx.childElementCount>28||document.hidden)return;
  const s=document.createElement('span');s.className='pt'+(f.type==='rise'?' up':'');
  if(f.items==='sprinkle'){s.classList.add('sprinkle');s.style.background=rnd(SPRINKLE)}
  else{s.textContent=rnd(f.items);s.style.fontSize=(12+Math.random()*14)+'px';if(f.type==='rise')s.style.color='#ffb347'}
  s.style.left=(Math.random()*100)+'%';const d=4+Math.random()*4;s.style.animationDuration=d+'s';
  fx.appendChild(s);setTimeout(()=>s.remove(),d*1000+100);
}
function fix(p){if(typeof p.coins!=='number')p.coins=0;if(!p.bests)p.bests={grass:p.best||0};if(!p.bestItems)p.bestItems={grass:!!p.bestItem};if(!Array.isArray(p.worlds))p.worlds=['grass'];p.items=Object.assign({bolt:0,slow:0,ice:0,big:0,shield:0,time:0},p.items||{});
  p.xp=Math.min(CUM[MAXLV],Math.max(0,+p.xp||0));p.eggs=Math.max(0,+p.eggs||0);p.pity=Math.max(0,+p.pity||0);
  if(!p.chars||typeof p.chars!=='object')p.chars={};Object.keys(p.chars).forEach(k=>{if(!CHI[k]||!(p.chars[k]>0))delete p.chars[k]});if(!(p.eq&&p.chars[p.eq]>0))p.eq=null;
  return p}

/* ---------- 저장 (이 기기에만 저장) ---------- */
function load(){try{const d=JSON.parse(localStorage.getItem('molePlayers')||'{}');players=(Array.isArray(d.players)?d.players:[]).map(fix);cur=d.cur||null;curWorld=WORLDS[d.world]?d.world:'grass'}catch(e){players=[]}
  if(!players.find(p=>p.id===cur))cur=null}
function save(){try{localStorage.setItem('molePlayers',JSON.stringify({players,cur,world:curWorld}))}catch(e){}}
const me=()=>players.find(p=>p.id===cur);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function refreshTop(){const p=me();$('whoAv').innerHTML=p?avOf(p):'🙂';$('whoNm').textContent=p?p.name:'플레이어';const lw=$('whoLv');lw.hidden=!p;if(p)lw.textContent='Lv.'+lvOf(p.xp)+(lvOf(p.xp)>=MAXLV?'👑':'');bestEl.textContent=p?wBest(p):0;coinsEl.textContent=p?p.coins:0;renderBoard();renderBar()}
function renderBoard(){
  const el=$('boardList'),w=W();
  $('boardTitle').textContent='🏆 '+w.ic+' 최고 기록판';$('boardSub').textContent=w.nm+' 친구별 최고 점수';

  const ranked=[...players].sort((a,b)=>wBest(b)-wBest(a)||a.name.localeCompare(b.name));
  el.innerHTML=ranked.map((q,i)=>{const b=wBest(q),it=q.bestItems&&q.bestItems[curWorld];return `<li class="${q.id===cur?'me':''}${i===0&&b>0?' top1':''}"><span class="medal">${b>0&&MEDALS[i]?MEDALS[i]:i+1}</span><span class="av">${avOf(q)}</span><span class="nm">${esc(q.name)}<small>Lv.${lvOf(q.xp)} · ${starsHtml(starCount(b))} · 🪙${q.coins||0}${it?' · ⚡':''}</small></span><span class="pt">${b}<small>점</small></span></li>`}).join('');
}

/* ---------- 구멍 ---------- */
const holes=[];
for(let i=0;i<9;i++){
  const b=document.createElement('button');b.className='hole';b.id='hole'+i;b.setAttribute('aria-label','구멍 '+(i+1));
  b.innerHTML='<div class="critter"></div>';
  b.addEventListener('pointerdown',e=>{e.preventDefault();whack(i,e)});
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();whack(i)}});
  $('grid').appendChild(b);holes.push({el:b,c:b.firstChild,kind:null,t:null});
}
function tone(f,d=.12,type='square',v=.08){
  if(!ctx)return;try{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);

  if(!s.exists())throw bad('그런 방이 없어요. 코드를 다시 봐요!');
  const r=s.val();
  if(r.status!=='lobby')throw bad('벌써 시작했어요');
  if(vsPlayers(r).length>=4)throw bad('방이 꽉 찼어요 (4명까지)');
  const pid=vsPid(p);
  vs={code,pid,host:false,F,phase:'lobby',prevWorld:curWorld,off:0,room:null,od:[]};
  await TMO(F.d.update(vsRef('players'),{[pid]:vsMeObj(p)}));
  vsListen();
}
const vsPid=p=>p.id+Math.random().toString(36).slice(2,5);
function vsListen(){
  const d=vs.F.d;
  vs.unsubOff=d.onValue(d.ref(vs.F.db,'.info/serverTimeOffset'),s=>{if(vs)vs.off=s.val()||0});
  vs.unsub=d.onValue(vsRef(),s=>vsOnRoom(s.val()));
  vsArmLobby();
}
function vsOnRoom(room){
  if(!vs)return;
  if(!room){if(vs.phase==='result'||vs.phase==='left')return;return vsEndMsg(vs.host?'방이 없어졌어요':'방장이 나갔어요')}
  vs.room=room;vs.host=room.host===vs.pid;
  if(vs.phase==='lobby'){if(room.status==='play'&&room.startAt)return vsCountdown(room);showVsLobby()}
  else if(vs.phase==='play')vsBar();
  else if(vs.phase==='wait')vsCheckDone();
  else if(vs.phase==='result'&&room.status==='lobby'){vs.phase='lobby';vs.fin=false;vsArmLobby();showVsLobby()}
}
function showVsLobby(){
  const r=vs.room,pl=vsPlayers(r),w=WORLDS[r.world]||WORLDS.grass;
  overlay.hidden=false;card.classList.remove('home');
  card.innerHTML=`<h2>⚔️ 친구 대결</h2>
    <p style="margin:0;font-size:16px;color:var(--dirt)">친구에게 이 코드를 알려 줘요</p>
    <div class="big" style="letter-spacing:8px;margin:0">${esc(vs.code)}</div>
    ${vs.host?`<div class="pre">${WORLD_IDS.map(id=>`<button class="tog${id===r.world?' on':''}" data-vw="${id}" aria-label="${WORLDS[id].nm}">${WORLDS[id].ic}</button>`).join('')}</div>`:''}
    <p style="font-size:18px;margin:2px 0">${w.ic} ${w.nm}</p>
    <ul class="vsl">${pl.map(([id,q])=>`<li class="${id===vs.pid?'me':''}"><span class="av">${vsAv(q)}</span><span class="nm">${esc(q.name)}</span><span class="lvchip">Lv.${+q.lv||1}</span>${id===r.host?'<span style="font-size:15px">👑</span>':''}</li>`).join('')}</ul>
    <p style="font-size:14px;color:var(--dirt);margin:4px 0">${pl.length}/4명 · 아이템은 쉬어요 · 이기면 ✨+20 🪙+3</p>
    ${vs.host?'':'<p style="font-size:15px;margin:4px 0">방장이 시작하면 바로 시작해요!</p>'}
    <div class="row"><button class="btn blue" id="vleave">나가기</button>${vs.host?`<button class="btn" id="vgo" ${pl.length<2?'disabled':''}>${pl.length<2?'친구를 기다려요':'시작!'}</button>`:''}</div>`;
  card.querySelectorAll('[data-vw]').forEach(b=>b.onclick=()=>{vs.F.d.update(vsRef(),{world:b.dataset.vw}).catch(()=>{})});
  $('vleave').onclick=vsLeave;
  const g=$('vgo');if(g)g.onclick=()=>{if(pl.length<2)return;g.disabled=true;
    vs.F.d.update(vsRef(),{status:'play',startAt:Date.now()+(vs.off||0)+4000}).catch(()=>{g.disabled=false})};
}
function vsCountdown(room){
  vs.phase='count';vsArmPlay();
  const wid=WORLDS[room.world]?room.world:'grass',w=WORLDS[wid];applyWorld(wid);
  const t0=room.startAt-(vs.off||0);overlay.hidden=false;card.classList.remove('home');
  vs.cd=null;
  vs.cdIv=setInterval(()=>{
    if(!vs||vs.phase!=='count'){clearInterval(vs&&vs.cdIv);return}
    const left=t0-Date.now();
    if(left<=0){clearInterval(vs.cdIv);vs.phase='play';start(true);return}
    const n=Math.ceil(left/1000);
    if(n!==vs.cd){vs.cd=n;card.innerHTML=`<h2>⚔️ 준비!</h2><div class="big" style="font-size:96px;margin:0">${Math.min(n,9)}</div><p>${w.ic} ${w.nm}</p><p style="font-size:15px;color:var(--dirt)">두더지를 많이 잡아요!</p>`;tone(n>1?440:660,.12,'triangle',.1)}
  },80);
}
function vsBar(){
  if(!vs||!vs.room)return;
  $('vsbar').innerHTML=vsPlayers(vs.room).map(([id,q])=>({id,q,s:id===vs.pid?score:(+q.score||0)})).sort((a,b)=>b.s-a.s)
    .map(o=>`<span class="${o.id===vs.pid?'me':''}">${vsAv(o.q)} ${esc(o.q.name)} <b>${o.s}</b></span>`).join('');
}
function vsFinish(xp){
  vs.phase='wait';vs.xp=xp;vs.fin=false;$('vsbar').hidden=true;
  overlay.hidden=false;card.classList.remove('home');
  card.innerHTML=`<h2>끝!</h2><div class="big">${score}점</div><p>친구들이 끝나길 기다려요…</p>`;
  vs.wt=setTimeout(vsResult,9000);
  vs.F.d.update(vsRef('players/'+vs.pid),{score,done:true}).catch(()=>{});
  vsCheckDone();
}
function vsCheckDone(){const pl=vsPlayers(vs&&vs.room);if(pl.length&&pl.every(([,q])=>q.done))vsResult()}
function vsResult(){
  if(!vs||vs.fin)return;vs.fin=true;clearTimeout(vs.wt);vs.phase='result';
  const p=me(),room=vs.room||{};
  const list=vsPlayers(room).map(([id,q])=>({id,q,s:id===vs.pid?score:(+q.score||0)})).sort((a,b)=>b.s-a.s);
  const top=list.length?list[0].s:0,winners=list.filter(o=>o.s===top&&top>0),win=list.length>=2&&top>0&&score===top;
  let xp=vs.xp,bonus='';
  if(p&&xp&&win){
    const r2=addXp(p,20);p.coins+=3;
    xp.r={l0:xp.r.l0,l1:r2.l1,c:xp.r.c+r2.c,e:xp.r.e+r2.e};xp.gain+=20;xp.b1=lvProg(p.xp);
    bonus='<p class="lvup" style="margin:6px 0">🏆 승리 보너스 ✨+20 · 🪙+3</p>';
  }
  if(p){save();refreshTop()}
  fanfare(win?3:1);
  const rank=o=>list.filter(x=>x.s>o.s).length;
  const msg=list.length<2?'친구가 나갔어요':win?(winners.length>1?'🤝 공동 1등!':'🏆 이겼어요!'):'아쉬워요! 다음엔 이길 수 있어요';
  card.innerHTML=`<h2>${msg}</h2><div class="big">${score}점</div>
    <ol class="rank">${list.map(o=>`<li class="${o.id===vs.pid?'me':''}"><span class="medal">${MEDALS[rank(o)]||rank(o)+1}</span><span>${vsAv(o.q)}</span><span class="nm">${esc(o.q.name)}</span><span class="pt">${o.s}점</span></li>`).join('')}</ol>
    ${bonus}${xp?xpBlock(xp):''}
    <div class="row"><button class="btn blue" id="vhome">🏠 나가기</button>${vs.host?'<button class="btn" id="vagain">🔁 한 번 더!</button>':''}</div>
    ${vs.host?'':'<p style="font-size:14px;color:var(--dirt)">방장이 다시 시작하면 돌아가요</p>'}`;
  if(xp)animXp(xp);
  $('vhome').onclick=vsLeave;
  const a=$('vagain');if(a)a.onclick=vsRematch;
}
async function vsRematch(){
  const upd={status:'lobby',startAt:null,seed:Math.floor(Math.random()*2147483647)};
  vsPlayers(vs.room).forEach(([id,q])=>{if(q.gone)upd['players/'+id]=null;else{upd['players/'+id+'/score']=0;upd['players/'+id+'/done']=false}});
  try{await TMO(vs.F.d.update(vsRef(),upd))}catch(e){}
}

/* ---------- 게임 ---------- */
function start(v){
  if(!me())return showPicker();
  initCtx();
  const p=me(),vm=v===true&&!!vs;let total=30;
  catches=0;earned=0;gameXp=0;gameRate=coinRate(lvOf(p.xp));usedItem=false;bigOn=false;slowUntil=0;iceUntil=0;
  if(!vm){
    if(selPre.big&&p.items.big>0){p.items.big--;bigOn=true;usedItem=true}
    if(selPre.time&&p.items.time>0){p.items.time--;total=35;usedItem=true}
    selPre={big:false,time:false};save();
  }
  score=0;time=total;scoreEl.textContent=0;timeEl.textContent=total;
  field.classList.remove('slowmo','icy','zap','quake');
  holes.forEach(h=>{clearTimeout(h.t);h.kind=null;h.hit=false;h.el.classList.remove('up','danger')});
  overlay.hidden=true;playing=true;$('whoAv').classList.toggle('cheer',!!p.eq);tone(520,.1);renderBar();
  if(vm){
    vs.sent=0;vs.fin=false;$('vsbar').hidden=false;vsBar();
    buildSched(vs.room.seed,vs.room.world).forEach(e=>timers.push(setTimeout(()=>{if(playing)show(holes[e.h],e.k,e)},e.t)));
    timers.push(setInterval(()=>{if(!playing||!vs)return;vsBar();if(score!==vs.sent){vs.sent=score;vs.F.d.update(vsRef('players/'+vs.pid),{score}).catch(()=>{})}},400));
  }else{
    timers.push(setTimeout(popUp,500));
    W().skulls.forEach(([a,b])=>timers.push(setTimeout(spawnSkull,(a+Math.random()*(b-a))*1000)));
  }
  const tick=setInterval(()=>{time--;timeEl.textContent=time;if(time<=5&&time>0)tone(440,.06,'sine');if(time<=0){clearInterval(tick);end()}},1000);
  timers.push(tick);
}
function xpBlock(xp){return `<p class="earn" style="margin:2px 0">✨ 경험치 +${xp.gain} <small style="font-size:14px;color:var(--dirt)">(두더지 ${gameXp} · 완주 5${xp.sb?` · 별 ${xp.sb*10}`:''}${xp.gain>gameXp+5+xp.sb*10?' · 승리 20':''})</small></p>
    <div class="xpbar"><i id="xpfill" style="width:${xp.b0.pct}%"></i></div>
    <p style="font-size:16px;margin:0">Lv.${xp.b1.l}${xp.b1.max?' 👑 MAX':` · ${xp.b1.cur}/${xp.b1.need}`}</p>
    ${xp.r.l1>xp.r.l0?`<p class="lvup">🎉 레벨 업! Lv.${xp.r.l0} → Lv.${xp.r.l1}<br>🪙+${xp.r.c}${xp.r.e?` · 🥚+${xp.r.e}`:''}${xp.r.l1>=MAXLV?' · 👑 왕관!':''}</p>`:''}`}
function animXp(xp){
  setTimeout(()=>{const f=$('xpfill');if(!f)return;
    if(xp.r.l1>xp.r.l0){f.style.width='100%';setTimeout(()=>{const g=$('xpfill');if(!g)return;g.style.transition='none';g.style.width='0%';void g.offsetWidth;g.style.transition='';g.style.width=xp.b1.pct+'%'},950)}
    else f.style.width=xp.b1.pct+'%'},80);
}
function end(){
  playing=false;timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];
  holes.forEach(hide);field.classList.remove('slowmo','icy');slowUntil=iceUntil=0;$('whoAv').classList.remove('cheer','yay');
  const p=me(),isVs=!!vs&&vs.phase==='play';let msg='잘했어요!',xp=null;
  if(p){p.plays=(p.plays||0)+1;
    const before=wBest(p),sb=isVs?0:Math.max(0,starCount(score)-starCount(before));
    if(!isVs){
      if(score>before&&score>0){p.bests[curWorld]=score;p.bestItems[curWorld]=usedItem;p.best=Math.max(p.best||0,score);msg=starCount(score)>starCount(before)?'별을 땄어요! 🌟':'새 기록이에요! 🎉'}
      else if(score>=25)msg='두더지 대장! 👑';
    }
    const gain=gameXp+5+sb*10,b0=lvProg(p.xp),r=addXp(p,gain);
    xp={gain,sb,r,b0,b1:lvProg(p.xp)};
    save();refreshTop();}
  if(isVs)return vsFinish(xp);
  [523,659,784].forEach((f,k)=>setTimeout(()=>tone(f,.18,'triangle',.1),k*130));
  if(xp&&xp.r.l1>xp.r.l0)[784,988,1175,1568].forEach((f,k)=>setTimeout(()=>tone(f,.14,'square',.06),500+k*110));
  const ranked=[...players].sort((a,b)=>wBest(b)-wBest(a)).slice(0,5);
  const list=ranked.map((q,i)=>`<li class="${q.id===cur?'me':''}"><span class="medal">${MEDALS[i]||i+1}</span><span>${avOf(q)}</span><span class="nm">${esc(q.name)}</span><span class="pt">${wBest(q)}점${q.bestItems&&q.bestItems[curWorld]?' ⚡':''}</span></li>`).join('');
  overlay.hidden=false;card.classList.remove('home');
  card.innerHTML=`<h2>${msg}</h2>
    <p>${W().ic} ${W().nm} · ${p?avOf(p)+' '+esc(p.name):''}</p>
    <div class="big">${score}점</div>
    <p style="font-size:26px;margin:0">${starsHtml(starCount(score))}</p>
    <p class="earn">잡은 두더지 ${catches}마리 → 🪙+${earned}</p>
    ${xp?xpBlock(xp):''}
    ${p?`<p style="font-size:16px;color:var(--dirt)">내 코인 🪙${p.coins}${p.eggs>0?` · 안 깬 알 🥚${p.eggs}`:''}</p>`:''}
    ${players.length>1?`<p style="font-size:18px">🏆 ${W().nm} 친구들 순위</p><ol class="rank">${list}</ol>`:''}
    <div class="row"><button class="btn blue" id="home">🏠 홈</button><button class="btn blue" id="shop">🏪 상점</button><button class="btn" id="go">한 번 더!</button></div>`;
  if(xp)animXp(xp);
  $('go').onclick=()=>p&&hasPre(p)?showIntro():start();$('home').onclick=showHome;$('shop').onclick=()=>showShop(null,showIntro);$('go').focus();
}
$('who').onclick=()=>{if(!playing)showPicker()};
renderBar();

load();refreshTop();
applyWorld(curWorld);if(me()&&!me().worlds.includes(curWorld))applyWorld('grass');refreshTop();
me()?showHome():showPicker();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
